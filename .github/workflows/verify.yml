name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chrome-and-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tests, builds, and release boundaries
        run: npm run verify
