<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Unfold AI</title>
    <link rel="icon" href="../../icons/icon16.png" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="topbar">
        <div class="brand"><img src="../../icons/icon32.png" width="30" height="30" alt="" /><div><h1>Unfold AI</h1><p>Summarize · Map · Save</p></div></div>
        <label class="switch"><span class="sr-only">Enable Unfold AI</span><input id="enabled" type="checkbox" /><span></span></label>
      </header>

      <section class="status-card">
        <div class="status-row"><span class="pulse"></span><strong id="status-title">Ready for long answers</strong><span id="version"></span></div>
        <p>Answers stay in your browser. No account, cloud API, or conversation tracking.</p>
      </section>

      <section>
        <div class="section-title"><h2>Reading depth</h2><span>Applied to new answers</span></div>
        <div class="segments" role="radiogroup" aria-label="Reading depth">
          <button type="button" data-preset="focus">Focus<small>1 section</small></button>
          <button type="button" data-preset="balanced">Balanced<small>2 sections</small></button>
          <button type="button" data-preset="full">Full context<small>Everything</small></button>
        </div>
      </section>

      <section class="settings">
        <label><span><strong>Auto-unfold long answers</strong><small>Summary and Answer Map after generation</small></span><input id="auto-unfold" type="checkbox" /></label>
        <label id="built-in-row"><span><strong>On-device AI summary</strong><small>Use Chrome’s local model when ready</small></span><input id="built-in" type="checkbox" /></label>
        <label><span><strong>Keyboard controls</strong><small>Modifier + arrow keys near an answer</small></span><input id="keyboard" type="checkbox" /></label>
      </section>

      <details>
        <summary>Sites and activation</summary>
        <div id="providers" class="providers"></div>
        <label class="threshold"><span>Minimum answer length</span><input id="threshold" type="number" min="60" max="1200" step="20" /><em>words</em></label>
      </details>

      <div class="actions">
        <button id="open-saved" class="primary" type="button">Open Saved insights</button>
        <button id="open-guide" type="button">How it works</button>
      </div>
      <footer><span><i></i> Local-only by design</span><a href="../../privacy.html" target="_blank">Privacy</a></footer>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
