<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Saved insights · Unfold AI</title><link rel="icon" href="../../icons/icon16.png"/><link rel="stylesheet" href="./saved.css"/></head><body>
<main><header><div class="brand"><img src="../../icons/icon48.png" width="38" height="38" alt=""/><div><span>UNFOLD AI</span><h1>Saved insights</h1></div></div><p>Your useful fragments, kept private and searchable.</p></header>
<section class="toolbar" aria-label="Saved insight controls"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search titles, notes, or saved text"/></label><select id="provider" aria-label="Filter by provider"><option value="">All providers</option></select><button id="export-md" type="button">Export Markdown</button><button id="backup" type="button">JSON backup</button><button id="restore" type="button">Restore</button><input id="restore-file" type="file" accept="application/json,.json" hidden/></section>
<div class="meta"><p id="count">0 saved insights</p><button id="delete-all" type="button">Delete all</button></div>
<section id="library" class="library" aria-live="polite"></section>
<section id="empty" class="empty"><div class="fold" aria-hidden="true"></div><h2>Save the part worth keeping.</h2><p>From any unfolded answer, choose <strong>Save answer</strong>. It will appear here—locally, with a link back to its source.</p></section>
<p id="status" class="toast" role="status" aria-live="polite"></p>
</main><script type="module" src="./saved.ts"></script></body></html>
